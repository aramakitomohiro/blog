<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon Redshift × AWS Backup</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--text:#1f2328;--muted:#59636e;--line:#d0d7de;--link:#0969da;--aws:#232f3e;--orange:#ff9900}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Arial,sans-serif;line-height:1.7}header{background:linear-gradient(135deg,var(--aws),#37475a);color:#fff;border-bottom:4px solid var(--orange);padding:24px 20px}header .inner{max-width:1450px;margin:auto}header h1{margin:0;font-size:clamp(1.45rem,3vw,2.25rem)}header p{margin:.35rem 0 0;color:#e8edf2}.layout{max-width:1450px;margin:0 auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:20px}.sidebar{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.sidebar a.home{display:block;margin-bottom:12px;color:var(--link);text-decoration:none;font-weight:600}.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;margin:2px 0;cursor:pointer;color:var(--text);font:inherit}.navbtn:hover{background:#f0f3f6}.navbtn.active{background:#eaf5ff;color:#0550ae;font-weight:700}.group{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:14px 8px 5px}main{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,40px)}#status{color:var(--muted);font-size:.9rem;margin-bottom:8px}h1,h2,h3,h4{line-height:1.3;scroll-margin-top:18px}h1{border-bottom:2px solid var(--line);padding-bottom:.45rem}h2{margin-top:2.4rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}h3{margin-top:1.8rem}a{color:var(--link)}blockquote{margin:1rem 0;padding:.7rem 1rem;border-left:4px solid var(--orange);background:#fff8e6}code{background:#eff1f3;padding:.14em .35em;border-radius:4px}pre{overflow:auto;background:#0d1117;color:#e6edf3;padding:15px;border-radius:8px}pre code{background:transparent;padding:0}table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;white-space:nowrap;font-size:.91rem;margin:1rem 0}th,td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}th{background:#f0f3f6}tr:nth-child(even) td{background:#fbfcfd}hr{border:0;border-top:1px solid var(--line);margin:2.5rem 0}.error{background:#fff1f0;border:1px solid #ffccc7;padding:14px;border-radius:8px;color:#8c1d18}.top{position:fixed;right:16px;bottom:16px;background:var(--aws);color:#fff!important;text-decoration:none;border-radius:999px;padding:9px 13px;box-shadow:0 4px 14px #0003;font-size:.88rem}
@media(max-width:900px){.layout{display:block;padding:10px}.sidebar{position:relative;top:auto;max-height:none;margin-bottom:10px}main{padding:18px}header{padding:20px 14px}table{font-size:.84rem}}
@media print{header,.sidebar,.top{display:none}.layout{display:block;padding:0}main{border:0}}
</style>
</head>
<body>
<header><div class="inner"><h1>Amazon Redshift × AWS Backup</h1><p>バックアップ設計・ランサムウェア対策・RPO/RTO・費用試算・AWS公式根拠</p></div></header>
<div class="layout">
<aside class="sidebar">

<div class="group">調査報告書</div>
<button class="navbtn" data-file="01_概要と標準バックアップ.md">1. 概要・標準バックアップ</button>
<button class="navbtn" data-file="02_AWSBackupとランサムウェア対策.md">2. AWS Backup・ランサムウェア</button>
<button class="navbtn" data-file="03_RPO_RTOと費用.md">3. RPO / RTO・費用</button>
<button class="navbtn" data-file="04_推奨構成と制約.md">4. 推奨構成・制約</button>
<button class="navbtn" data-file="05_実環境検証方針.md">5. 実環境検証方針</button>

<div class="group">費用試算</div>

<div class="group">公式根拠</div>
<button class="navbtn" data-file="10_AWS公式根拠_S01-S31.md">10. AWS公式根拠 S01-S31</button>
<button class="navbtn" data-file="11_AWS公式根拠_S32-S61.md">11. AWS公式根拠 S32-S61</button>
<button class="navbtn" data-file="12_AWS_CLI根拠_C001-C055.md">12. AWS CLI根拠 C001-C055</button>
<button class="navbtn" data-file="13_AWS_CLI根拠_C057-C085.md">13. AWS CLI根拠 C057-C085</button>

<main id="top"><div id="status">読み込み中...</div><article id="content"></article></main>
</div>
<a class="top" href="#top">↑ Top</a>
<script>
const buttons=[...document.querySelectorAll('.navbtn')];
const content=document.getElementById('content');
const statusEl=document.getElementById('status');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(s){s=esc(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');s=s.replace(/(^|\s)\*([^*]+)\*/g,'$1<em>$2</em>');return s}
function render(md){const lines=md.replace(/\r/g,'').split('\n');let out='',i=0,inCode=false,code=[];const closeLists=()=>{if(out.endsWith('<!--ul-->'))out=out.slice(0,-9)+'</ul>';if(out.endsWith('<!--ol-->'))out=out.slice(0,-9)+'</ol>'};while(i<lines.length){let line=lines[i];if(line.startsWith('```')){if(!inCode){closeLists();inCode=true;code=[]}else{out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';inCode=false}i++;continue}if(inCode){code.push(line);i++;continue}if(!line.trim()){closeLists();i++;continue}const hm=line.match(/^(#{1,4})\s+(.+)$/);if(hm){closeLists();const n=hm[1].length;const txt=hm[2];const id=txt.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase();out+=`<h${n} id="${id}">${inline(txt)}</h${n}>`;i++;continue}if(/^\s*>\s?/.test(line)){closeLists();let q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}out+='<blockquote>'+q.map(inline).join('<br>')+'</blockquote>';continue}if(/^\s*[-*+]\s+/.test(line)){if(!out.endsWith('<!--ul-->')){closeLists();out+='<ul><!--ul-->'}out=out.slice(0,-9)+`<li>${inline(line.replace(/^\s*[-*+]\s+/,''))}</li><!--ul-->`;i++;continue}if(/^\s*\d+\.\s+/.test(line)){if(!out.endsWith('<!--ol-->')){closeLists();out+='<ol><!--ol-->'}out=out.slice(0,-9)+`<li>${inline(line.replace(/^\s*\d+\.\s+/,''))}</li><!--ol-->`;i++;continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){closeLists();const rows=[];const split=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());rows.push(split(line));i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(split(lines[i]));i++}out+='<table><thead><tr>'+rows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^\s*---+\s*$/.test(line)){closeLists();out+='<hr>';i++;continue}closeLists();let p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,4})\s+/.test(lines[i])&&!/^\s*>/.test(lines[i])&&!/^\s*[-*+]\s+/.test(lines[i])&&!/^\s*\d+\.\s+/.test(lines[i])&&!lines[i].startsWith('```')&&!/^\s*---+\s*$/.test(lines[i])){if(lines[i].includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1]))break;p.push(lines[i]);i++}out+='<p>'+p.map(inline).join('<br>')+'</p>'}closeLists();return out}
async function load(file,btn){buttons.forEach(b=>b.classList.toggle('active',b===btn));statusEl.textContent='読み込み中: '+file;try{const r=await fetch(encodeURI(file),{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const md=await r.text();content.innerHTML=render(md);statusEl.textContent=file;history.replaceState(null,'','#'+encodeURIComponent(file));window.scrollTo({top:0,behavior:'smooth'})}catch(e){content.innerHTML='<div class="error">資料を読み込めませんでした: '+esc(String(e))+'</div>';statusEl.textContent='読み込み失敗'}}
buttons.forEach(b=>b.addEventListener('click',()=>load(b.dataset.file,b)));
let requested='';try{requested=decodeURIComponent(location.hash.slice(1))}catch(e){}const first=buttons.find(b=>b.dataset.file===requested)||buttons[0];load(first.dataset.file,first);
</script>
</body>
</html>
